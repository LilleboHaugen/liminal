# Version updates for the SHA-pinned actions in .github/workflows/ (M1-T006). Dependabot keeps the
# full-SHA pin and rewrites the `# vX.Y.Z` comment. All action updates of one check arrive as one
# pull request, so one task and one CI run cover them. Cargo dependencies are not updated here: a
# new or changed crate dependency needs an ADR (docs/process/DEPENDENCIES.md); advisories for them
# are checked by `cargo xtask deny`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
