# ---------------------------------------------------------------- Approved external crates
# scope: runtime (may ship in games) | build (proc-macro / build-script only) | dev (tests/benches only) | tool (layer 5 only)
# A crate listed here is approved for the crates that list it above, nowhere else.

[external.winit]
scope = "runtime"
adr = "ADR-0007"
reason = "Cross-platform windowing and OS event loop; not performance-critical; replaceable behind liminal_platform."

[external.raw-window-handle]
scope = "runtime"
adr = "ADR-0007"
reason = "Interop type for passing native window handles from liminal_platform to liminal_gpu."

[external.ash]
scope = "runtime"
adr = "ADR-0006"
reason = "Raw Vulkan bindings (no abstraction); liminal_gpu implements its own RHI on top."

[external.objc2]
scope = "runtime"
adr = "ADR-0006"
reason = "Objective-C runtime interop needed to call Metal and Core Animation."

[external.objc2-foundation]
scope = "runtime"
adr = "ADR-0006"
reason = "Foundation bindings used by the Metal backend."

[external.objc2-metal]
scope = "runtime"
adr = "ADR-0006"
reason = "Raw Metal bindings (no abstraction)."

[external.objc2-quartz-core]
scope = "runtime"
adr = "ADR-0006"
reason = "CAMetalLayer for presenting to a window on macOS."

[external.syn]
scope = "build"
adr = "ADR-0003"
reason = "Rust syntax parsing for derive macros; compile-time only."

[external.quote]
scope = "build"
adr = "ADR-0003"
reason = "Token generation for derive macros; compile-time only."

[external.proc-macro2]
scope = "build"
adr = "ADR-0003"
reason = "Token stream types for derive macros; compile-time only."

[external.proptest]
scope = "dev"
adr = "ADR-0010"
reason = "Property-based testing with shrinking."

[external.loom]
scope = "dev"
adr = "ADR-0010"
reason = "Exhaustive concurrency permutation testing for lock-free code in liminal_jobs."

[external.serde]
scope = "tool"
adr = "ADR-0003"
reason = "xtask: deserializing architecture.toml, cargo metadata and coverage reports."

[external.serde_json]
scope = "tool"
adr = "ADR-0003"
reason = "xtask: JSON reports and parsing tool output."

[external.toml]
scope = "tool"
adr = "ADR-0003"
reason = "xtask: parsing architecture.toml and ci/*.toml."

[external.cargo_metadata]
scope = "tool"
adr = "ADR-0003"
reason = "xtask: typed access to `cargo metadata` for check-arch."

[external.bevy_ecs]
scope = "dev"
adr = "ADR-0023"
reason = "Competitive ECS benchmark baseline; only in the excluded benches/competitive workspace."

[external.hecs]
scope = "dev"
adr = "ADR-0023"
reason = "Competitive ECS benchmark baseline; only in the excluded benches/competitive workspace."

[external.glam]
scope = "dev"
adr = "ADR-0023"
reason = "Competitive math benchmark baseline; only in the excluded benches/competitive workspace."

[external.rayon]
scope = "dev"
adr = "ADR-0023"
reason = "Competitive job-system benchmark baseline; only in the excluded benches/competitive workspace."
