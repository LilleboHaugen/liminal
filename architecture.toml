# architecture.toml — normative registry of Liminal's crate graph.
#
# Enforced by `cargo xtask check-arch` (task M0-T004, spec docs/specs/xtask.md).
# Rules (ADR-0004):
#   1. Every crate in the Cargo workspace MUST have a [[crate]] entry here. Entries for crates that do not
#      exist yet are allowed (planned crates).
#   2. A crate MAY depend on engine crates in strictly lower layers, plus those in `same_layer_deps`.
#   3. A crate MAY depend on external crates only if they are listed in its `external` (normal/build deps)
#      or `dev_external` (dev-dependencies) list AND approved in the [external.*] table with a matching scope.
#   4. `unsafe = "forbid"` crates MUST contain `#![forbid(unsafe_code)]` at the crate root.
#   5. Layer 5 (tools) crates MUST NOT be dependencies of any layer 0–4 crate.
# kind: "lib" = library only; "proc-macro"; "bin" = the package has at least one binary target and MAY
#   also have a library target (e.g. xtask: logic in src/lib.rs, thin src/main.rs).
# Changing this file is an architectural change: reference an ADR or task in the commit message.

schema_version = 1

[layers]
"0" = "foundation"
"1" = "runtime"
"2" = "platform-gpu"
"3" = "subsystems"
"4" = "agent-interface-integration"
"5" = "tools"

# ---------------------------------------------------------------- Layer 0: foundation

[[crate]]
name = "liminal_core"
path = "crates/liminal_core"
layer = 0
kind = "lib"
unsafe = "forbid"
deterministic = true          # simulation-critical: determinism lints apply (ADR-0009)
same_layer_deps = []
external = []
dev_external = ["proptest"]

[[crate]]
name = "liminal_math"
path = "crates/liminal_math"
layer = 0
kind = "lib"
unsafe = "allow"              # SIMD intrinsics
deterministic = true
same_layer_deps = ["liminal_core"]
external = []
dev_external = ["proptest"]

[[crate]]
name = "liminal_memory"
path = "crates/liminal_memory"
layer = 0
kind = "lib"
unsafe = "allow"
deterministic = true
same_layer_deps = ["liminal_core"]
external = []
dev_external = ["proptest"]

[[crate]]
name = "liminal_telemetry"
path = "crates/liminal_telemetry"
layer = 0
kind = "lib"
unsafe = "allow"              # lock-free per-thread buffers (ADR-0016)
deterministic = false
same_layer_deps = ["liminal_core"]
external = []
dev_external = ["proptest", "loom"]

[[crate]]
name = "liminal_reflect"
path = "crates/liminal_reflect"
layer = 0
kind = "lib"
unsafe = "forbid"
deterministic = true
same_layer_deps = ["liminal_core", "liminal_reflect_derive"]
external = []
dev_external = ["proptest"]

[[crate]]
name = "liminal_reflect_derive"
path = "crates/liminal_reflect_derive"
layer = 0
kind = "proc-macro"
unsafe = "forbid"
deterministic = false
same_layer_deps = []
external = ["syn", "quote", "proc-macro2"]
dev_external = []

